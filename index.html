<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>HTML</title>
  <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
.logo {
  height: 100px;
  padding: 30px;
}
.container {
  padding-top: 100px;
  width: 100%;
  height: 100vh;
  color: white;
  font-size: 2rem;
  background: linear-gradient(135deg,#000428,#004e92);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  gap: 80px;
}

#mediaUrl {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
#videoUrl {
  width: 57rem;
  font-size: 2rem;
  padding: 35px;
  color: white;
  background: linear-gradient(135deg,#141e30,#243b55,#00c6ff);
  border-radius: 20px;
  border: 1.5px solid;
  margin-top: 20px;
  margin-bottom: 20px;
}
#btnDownload {
  width: 57rem;
  font-size: 2rem;
  color: white;
  padding: 35px;
  background: linear-gradient(280deg,#141e30,#243b55,#00c6ff);
  border-radius: 20px;
  border: 1.5px solid;
  margin-top: 20px;
  margin-bottom: 20px;
  cursor: pointer;
}
  </style>
</head>

<body>
  <header>
    <div class="logo">
      <h1>AZPDOWNLOADER</h1>
    </div>
  </header>
  
  <main>
    <section class="container">
      <h2>Video Downloader</h2>
      <p>Download video Tiktok/Instagram/Youtube/Film</p>
      <form action="/download" method="get" id="mediaUrl">
        <input type="url" id="videoUrl" Placeholder="Tempelkan tautan anda di sini">
        <button type="submit" id="btnDownload">Download</button>
      </form>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
